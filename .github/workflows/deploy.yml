# Builds the app and publishes it to GitHub Pages so it can be used from a URL
# with nothing installed. Only the app code is hosted — PDFs are still processed
# entirely in the visitor's browser.
#
# One-time setup: in the repo, go to Settings → Pages → "Build and deployment" →
# Source: "GitHub Actions". After that, every push to the branch below redeploys.
name: Deploy to GitHub Pages

on:
  push:
    # This repo's default branch. If you rename/merge it, update this list.
    branches: ["claude/clever-archimedes-Z08JR"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel older in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
